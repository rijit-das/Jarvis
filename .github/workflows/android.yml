name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install Android command line tools + API 34 components.
      # (Runner images vary in whether sdkmanager is on PATH, so we
      # fetch cmdline-tools directly — no runner-internal assumptions.)
      - name: Set up Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain --continue 2>&1 | tee gradle-build.log

      # Publish compiler/test errors as a GitHub issue so they are readable
      # without access to the raw job logs.
      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo
            echo '```'
            grep -E "^(e: |FAILED|.*> Could not|.*error:|> Task .* FAILED|.*tests? completed)" gradle-build.log | head -120 || true
            echo '--- failing tests ---'
            find app/build/test-results -name "*.xml" -exec grep -l "<failure" {} \; 2>/dev/null | while read -r f; do
              grep -A 6 "<failure" "$f" | head -40
            done || true
            echo '--- tail ---'
            tail -60 gradle-build.log
            echo '```'
          } > diagnostics.md
          gh issue create \
            --title "CI build diagnostics" \
            --body-file diagnostics.md \
            --label "ci" || gh issue create --title "CI build diagnostics" --body-file diagnostics.md

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
